<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watchfloor Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Chakra+Petch:wght@600&display=swap">
<style>body{margin:0;font-size:14px;-webkit-font-smoothing:antialiased}[hidden]{display:none!important}</style>
<style>
/* Layout: full-bleed globe. Left rail = feed / briefing / layers. Right = alert dossier + camera. Bottom = event timeline. Single dark look by choice. */
:root {
  --bg: #05080d;
  --panel: rgba(9, 15, 24, 0.86);
  --line: #1c2a3b;
  --fg: #d6e2ee;
  --muted: #7a8ea3;
  --accent: #f0b43c;
  --crit: #ff4d3d;
  --ok: #58c4a8;
  --cyan: #46d6e8;
  --nuke: #c6f05a;
  --f-display: "Chakra Petch", "IBM Plex Sans KR", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); overflow: hidden; }
#app { position: relative; height: 100%; }
#globe { position: absolute; inset: 0; }
#globe canvas { display: block; }
.rail, .dossier, .cam, .timeline { box-sizing: border-box; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- top bar ---------- */
.topbar {
  position: absolute; top: 0; left: 0; right: 0; z-index: 6;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 12px; padding-left: var(--gl); padding-right: var(--gr);
  background: linear-gradient(var(--bg), transparent);
}
.brand { font-family: var(--f-display); letter-spacing: .18em; font-size: 15px; text-transform: uppercase; }
.brand b { color: var(--accent); font-weight: 600; }
.brand small { font: 400 10px var(--f-mono); color: var(--muted); letter-spacing: .1em; margin-left: 6px; }
.clock { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 14px; }
.clock b { color: var(--fg); font-weight: 400; }
.idx { display: flex; align-items: center; gap: 8px; font: 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; background: rgba(9,15,24,.7); }
.idx .bar { width: 70px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.idx .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .8s, background .8s; }
.idx b { font-size: 13px; color: var(--fg); font-variant-numeric: tabular-nums; }
.idx .lv { font-weight: 600; letter-spacing: .08em; }
.spacer { flex: 1; }
.btn { font: 600 12px var(--f-body); color: var(--fg); background: rgba(20, 32, 48, .8); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.warn { border-color: rgba(255, 77, 61, .6); color: #ffd2cc; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.btn kbd { font: 10px var(--f-mono); color: var(--muted); margin-left: 6px; }

/* ---------- left rail ---------- */
.rail {
  position: absolute; z-index: 4; left: var(--gl); top: 64px; bottom: 92px; width: 310px;
  display: flex; flex-direction: column; min-height: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px);
}
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: 600 11px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; padding: 11px 8px 9px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs .live { color: var(--ok); }
.tabs .live::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin-right: 6px; vertical-align: middle; animation: blink 1.6s infinite; }
.tabs .live.paused { color: var(--muted); }
.tabs .live.paused::before { background: var(--muted); animation: none; }
.stats { display: flex; gap: 16px; padding: 10px 14px; font: 11px var(--f-mono); color: var(--muted); border-bottom: 1px solid var(--line); }
.stats b { color: var(--fg); font-weight: 600; font-size: 13px; display: block; }
.pane { flex: 1; min-height: 0; overflow-y: auto; }
.feed { list-style: none; margin: 0; padding: 4px 6px 8px; }
.feed li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; padding: 8px; border-radius: 4px; cursor: pointer; border-left: 2px solid transparent; }
.feed li:hover, .feed li:focus-visible { background: rgba(255,255,255,.04); outline: none; }
.feed li.sev-crit { border-left-color: var(--crit); }
.feed li.sev-high { border-left-color: var(--accent); }
.feed li.new { animation: slidein .5s ease-out; }
.mag { font: 600 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.sev-crit .mag { color: var(--crit); }
.sev-high .mag { color: var(--accent); }
.feed .place { font-size: 13px; line-height: 1.35; }
.feed .meta { font: 11px var(--f-mono); color: var(--muted); margin-top: 2px; }
.brief { padding: 12px 14px 14px; font-size: 13px; line-height: 1.65; }
.brief .stamp { font: 11px var(--f-mono); color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
.brief p { margin: 0 0 10px; }
.brief p b { color: var(--accent); font-weight: 600; }
.brief .tag { display: inline-block; font: 600 10px var(--f-mono); letter-spacing: .08em; padding: 1px 6px; border-radius: 3px; margin-right: 6px; vertical-align: 1px; border: 1px solid currentColor; }
.brief .t-q { color: var(--accent); } .brief .t-n { color: var(--nuke); } .brief .t-s { color: var(--cyan); } .brief .t-m { color: var(--crit); }
.layers { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 6px; }
.layers .lbl { width: 100%; font: 600 10px var(--f-mono); letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.chip { font: 600 11px var(--f-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .5; }
.chip[aria-pressed="true"] { color: var(--fg); border-color: #2c4058; }
.chip[aria-pressed="true"] i { opacity: 1; background: var(--c); }
.keys { padding: 8px 14px 12px; font: 10px var(--f-mono); color: var(--muted); border-top: 1px solid var(--line); line-height: 1.7; }
.keys kbd { color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

/* ---------- alerts ---------- */
.banner {
  position: absolute; z-index: 7; left: 50%; top: 70px; transform: translateX(-50%);
  font: 600 13px var(--f-display); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap;
  padding: 8px 18px; border: 1px solid var(--crit); color: #fff; background: rgba(120, 18, 10, .78);
  animation: flash .5s steps(2) 4;
}
.banner.high { border-color: var(--accent); background: rgba(110, 72, 8, .78); }
.flash-edge { position: absolute; inset: 0; z-index: 3; pointer-events: none; box-shadow: inset 0 0 140px rgba(255, 50, 30, .5); animation: fade 2.6s ease-out forwards; }
.scan { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(transparent 0, rgba(70,214,232,.10) 50%, transparent 100%); height: 30%; animation: sweep 1.4s ease-in-out 1; opacity: 0; }

.dossier {
  position: absolute; z-index: 5; right: var(--gr); top: 64px; width: 350px; max-height: calc(100% - 64px - 92px);
  overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-top: 2px solid var(--crit); border-radius: 6px;
  backdrop-filter: blur(6px); padding: 14px 16px 16px; animation: dossierIn .45s cubic-bezier(.2,.8,.2,1);
}
.dossier.high { border-top-color: var(--accent); }
.dossier.low { border-top-color: #9fd3ff; }
.dossier .kind { font: 600 11px var(--f-mono); letter-spacing: .14em; color: var(--crit); text-transform: uppercase; }
.dossier.high .kind { color: var(--accent); }
.dossier.low .kind { color: #9fd3ff; }
.dossier h3 { margin: 6px 28px 12px 0; font: 600 19px/1.3 var(--f-body); text-wrap: balance; }
.dossier dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; font-size: 13px; }
.dossier dt { color: var(--muted); font-size: 12px; }
.dossier dd { margin: 0; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.dossier dt, .dossier dd { opacity: 0; animation: rowIn .25s ease-out forwards; }
.dossier .note { margin: 10px 0 0; font-size: 11px; color: var(--muted); line-height: 1.5; }
.dossier .demo { display: inline-block; margin-left: 8px; padding: 1px 6px; border: 1px solid var(--accent); color: var(--accent); border-radius: 3px; font-size: 10px; }
.sec { margin-top: 14px; opacity: 0; animation: rowIn .3s ease-out forwards; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font: 600 11px var(--f-mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.sec-h b { color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: 0; font-size: 13px; }
.sec-h.n { color: var(--nuke); } .sec-h.t { color: var(--cyan); }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font: 400 10px var(--f-mono); color: var(--muted); padding: 4px 4px 4px 0; letter-spacing: .08em; }
.tbl td { padding: 6px 4px 6px 0; border-top: 1px solid var(--line); font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td:first-child { font-family: var(--f-body); white-space: normal; }
.tbl .none { color: var(--muted); font-family: var(--f-body); white-space: normal; }
.shindo { display: inline-block; min-width: 26px; text-align: center; padding: 1px 4px; border-radius: 3px; font-weight: 600; color: #0b1018; }
.st { color: var(--muted); }
.st.s { color: var(--accent); }
.st.hit { color: var(--crit); font-weight: 600; animation: flash .4s steps(2) 3; }
.countdown { font: 600 28px var(--f-mono); font-variant-numeric: tabular-nums; color: var(--crit); letter-spacing: .04em; }
.close { position: absolute; top: 8px; right: 8px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px 8px; }

.cam {
  position: absolute; z-index: 5; top: 120px; right: calc(var(--gr) + 362px); width: 290px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px);
  padding: 10px; animation: dossierIn .45s cubic-bezier(.2,.8,.2,1);
}
.cam .hd { display: flex; justify-content: space-between; font: 600 11px var(--f-mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
.cam .hd .rec { color: var(--crit); animation: blink 1.2s infinite; }
.cam .view { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 3px; overflow: hidden; }
.cam canvas { width: 100%; height: 100%; display: block; opacity: .55; }
.cam .ovl { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; font: 11px var(--f-mono); color: #e6eef6; text-shadow: 0 1px 2px #000; }
.cam .ovl .mid { align-self: center; text-align: center; font-size: 12px; line-height: 1.5; }
.cam .links { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.cam .links a { flex: 1; text-align: center; font: 600 12px var(--f-body); color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; background: rgba(20, 32, 48, .8); }
.cam .links a:hover, .cam .links a:focus-visible { border-color: var(--accent); outline: none; }

.reticle { pointer-events: none; transform: translate(-50%, -50%); }
.reticle .box { width: 46px; height: 46px; border: 1px solid var(--crit); position: relative; animation: lock .6s ease-out; }
.reticle .box::before, .reticle .box::after { content: ""; position: absolute; background: var(--crit); }
.reticle .box::before { left: 50%; top: -10px; bottom: -10px; width: 1px; opacity: .5; }
.reticle .box::after { top: 50%; left: -10px; right: -10px; height: 1px; opacity: .5; }
.reticle.high .box { border-color: var(--accent); }
.reticle.high .box::before, .reticle.high .box::after { background: var(--accent); }
.reticle.low .box { border-color: #9fd3ff; }
.reticle .tag { position: absolute; left: 56px; top: 0; white-space: nowrap; font: 600 11px var(--f-mono); color: #fff; background: rgba(0,0,0,.6); padding: 2px 6px; }

/* ---------- timeline ---------- */
.timeline {
  position: absolute; z-index: 4; left: var(--gl); right: var(--gr); bottom: max(16px, env(safe-area-inset-bottom, 0px)); height: 62px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px);
  display: flex; align-items: stretch; gap: 16px; padding: 8px 14px;
}
.tl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tl-axis { display: flex; justify-content: space-between; font: 10px var(--f-mono); color: var(--muted); }
.tl-track { position: relative; flex: 1; border-bottom: 1px solid var(--line); margin-top: 4px; }
.tl-track button { position: absolute; bottom: 0; width: 9px; margin-left: -4px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; height: 100%; }
.tl-track button i { display: block; width: 3px; border-radius: 1px; background: #3a5068; transition: background .3s; }
.tl-track button.on i { background: #9fd3ff; }
.tl-track button.on.sev-high i { background: var(--accent); }
.tl-track button.on.sev-crit i { background: var(--crit); }
.tl-track button.cur i { box-shadow: 0 0 0 2px rgba(255,255,255,.35); }
.tl-head { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--cyan); transition: left .6s; pointer-events: none; }
.tl-head::after { content: ""; position: absolute; top: -3px; left: -3px; width: 7px; height: 7px; background: var(--cyan); transform: rotate(45deg); }
.legend { display: flex; flex-direction: column; justify-content: center; gap: 6px; font: 10px var(--f-mono); color: var(--muted); border-left: 1px solid var(--line); padding-left: 14px; }
.legend .row { display: flex; gap: 12px; align-items: center; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
.legend .sc { display: flex; gap: 2px; }
.legend .sc span { width: 18px; text-align: center; color: #0b1018; font-weight: 600; border-radius: 2px; }

/* ---------- boot ---------- */
.boot { position: absolute; inset: 0; z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: center; padding-left: var(--gl); padding-right: var(--gr); cursor: pointer; transition: opacity .6s; }
.boot.out { opacity: 0; pointer-events: none; }
.boot pre { margin: 0; font: 13px/1.9 var(--f-mono); color: var(--muted); white-space: pre-wrap; max-width: 520px; width: 100%; }
.boot pre b { color: var(--ok); font-weight: 600; }
.boot pre em { color: var(--accent); font-style: normal; }
.boot pre .h { font-family: var(--f-display); font-size: 20px; letter-spacing: .2em; color: var(--fg); }

@keyframes blink { 50% { opacity: .25; } }
@keyframes slidein { from { transform: translateX(-12px); opacity: 0; } }
@keyframes flash { 50% { opacity: .2; } }
@keyframes fade { to { opacity: 0; } }
@keyframes sweep { 0% { top: -30%; opacity: 1; } 100% { top: 100%; opacity: 1; } }
@keyframes dossierIn { from { transform: translateX(24px); opacity: 0; } }
@keyframes rowIn { from { transform: translateY(4px); } to { opacity: 1; } }
@keyframes lock { from { transform: scale(2.4); opacity: 0; } }

@media (max-width: 1280px) {
  .cam { top: auto; bottom: 92px; right: var(--gr); }
  .dossier { max-height: calc(100% - 64px - 92px - 250px); }
}
@media (max-width: 1100px) { .legend { display: none; } .idx .bar { display: none; } }
@media (max-width: 760px) {
  .rail { top: auto; bottom: 86px; height: 30%; width: auto; right: var(--gr); }
  .dossier { top: auto; bottom: 86px; left: var(--gl); width: auto; max-height: 44%; z-index: 6; }
  .cam { display: none; }
  .timeline { height: 56px; }
  .clock .utc, .brand small, .btn kbd, .keys { display: none; }
  .banner { font-size: 11px; top: 100px; }
  .topbar { gap: 8px 10px; }
  .btn { padding: 6px 9px; font-size: 11px; }
  #sound, .idx > span:first-child { display: none; }
  .layers { flex-wrap: nowrap; overflow-x: auto; }
  .layers .lbl { display: none; }
  .chip { flex: none; }
  .stats { gap: 12px; padding: 8px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}

/* ---------- local-version additions ---------- */
.srcs { display: flex; gap: 10px; font: 10px var(--f-mono); color: var(--muted); letter-spacing: .06em; }
.srcs span::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: #3a5068; }
.srcs span[data-s="ok"]::before, .srcs span[data-s="ready"]::before { background: var(--ok); }
.srcs span[data-s="snapshot"]::before, .srcs span[data-s="wait"]::before { background: var(--accent); }
.srcs span[data-s="error"]::before { background: var(--crit); }
.banner.cyan { border-color: var(--cyan); background: rgba(8, 70, 84, .82); }
.dossier.cyan { border-top-color: var(--cyan); }
.dossier.cyan .kind { color: var(--cyan); }
.cam.video { width: 380px; }
.cam .view iframe, .cam .view img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
.cam .alts { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.cam .alts button { font: 11px var(--f-body); color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 3px; padding: 3px 7px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cam .alts button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); }
.cam .meta { font: 11px var(--f-mono); color: var(--muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai { margin: 4px 0 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ai .btn { padding: 6px 10px; }
.ai small { color: var(--muted); font-size: 11px; }
.ai-out { border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; margin-bottom: 12px; white-space: pre-wrap; font-size: 13px; line-height: 1.65; background: rgba(255,255,255,.02); }
.ai-out .lab { display: block; font: 600 10px var(--f-mono); letter-spacing: .12em; color: var(--accent); margin-bottom: 6px; text-transform: uppercase; }
.feed .src-tag { font: 600 9px var(--f-mono); letter-spacing: .08em; border: 1px solid var(--line); border-radius: 2px; padding: 0 3px; margin-right: 5px; color: var(--muted); }
.feed .src-tag.jma { color: #ff9b8a; border-color: rgba(255,120,100,.4); }
.feed .src-tag.eew { color: var(--crit); border-color: var(--crit); }
.feed .src-tag.tsu { color: var(--cyan); border-color: var(--cyan); }
@media (max-width: 1100px) { .srcs { display: none; } }
</style>

</head>
<body>
<div id="app">
  <div id="globe" aria-label="실시간 경보 지구본"></div>

  <div class="topbar">
    <div class="brand"><b>◢</b> Watchfloor<small>LIVE</small></div>
    <div class="clock"><span class="utc">UTC <b id="utc">--:--:--</b></span><span>KST <b id="kst">--:--:--</b></span></div>
    <div class="idx" title="최근 48시간 지진 규모로 계산한 자체 활동 지수예요"><span>활동 지수</span><span class="bar"><i id="idxBar"></i></span><b id="idxVal">0</b><span class="lv" id="idxLv">안정</span></div>
    <div class="srcs" id="srcs"><span data-k="usgs">USGS</span><span data-k="jma">JMA</span><span data-k="aircraft">항공</span><span data-k="webcams">웹캠</span><span data-k="ai">AI</span></div>
    <div class="spacer"></div>
    <button class="btn" id="pause" aria-pressed="false" type="button">자동 이동 끄기<kbd>Space</kbd></button>
    <button class="btn" id="next" type="button">다음 경보<kbd>N</kbd></button>
    <button class="btn warn" id="eewTest" type="button">속보 테스트<kbd>E</kbd></button>
    <button class="btn warn" id="jalert" type="button">J-Alert 데모<kbd>J</kbd></button>
    <button class="btn" id="sound" aria-pressed="false" type="button">소리 켜기</button>
  </div>

  <aside class="rail">
    <div class="tabs" role="tablist">
      <button role="tab" id="tabFeed" aria-selected="true" aria-controls="paneFeed" type="button"><span class="live" id="liveDot">실시간 피드</span></button>

function distKm(a1, o1, a2, o2) {
  const dA = rad(a2 - a1), dO = rad(o2 - o1);
  const h = Math.sin(dA / 2) ** 2 + Math.cos(rad(a1)) * Math.cos(rad(a2)) * Math.sin(dO / 2) ** 2;
  return 2 * R_E * Math.asin(Math.min(1, Math.sqrt(h)));
}
function circle(lat, lng, km, n = 120) {
  const d = km / R_E, la = rad(lat), lo = rad(lng), pts = [];
  for (let i = 0; i <= n; i++) {
    const b = 2 * Math.PI * i / n;
    const la2 = Math.asin(Math.sin(la) * Math.cos(d) + Math.cos(la) * Math.sin(d) * Math.cos(b));
    const lo2 = lo + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(la), Math.cos(d) - Math.sin(la) * Math.sin(la2));
    pts.push([deg(la2), deg(lo2)]);

}

  return 2.68 + 1.72 * Math.log10(10 ** lg * 1.41);
}

  const hrs = now.getUTCHours() + now.getUTCMinutes() / 60;

    const cla = rad(la + S / 2), clo = rad(lo + S / 2);
    const sinEl = Math.sin(cla) * Math.sin(decl) + Math.cos(cla) * Math.cos(decl) * Math.cos(clo - rad(subLng));
    const a = Math.max(0, Math.min(1, (0.08 - sinEl) / 0.3)) * 0.38;
    if (a > 0.02) cells.push({ night: true, a: a.toFixed(2), geometry: { type: 'Polygon', coordinates: [[[lo, la], [lo + S, la], [lo + S, la + S], [lo, la + S], [lo, la]]] } });

// ================= WAVES =================
// speed 1 = real time measured from originTime (used for live EEW); 20 = replay of a past quake
function startWaves(e, speed, originTime) {
  const start = performance.now();
  const near = simCities.slice(0, 4);
  const maxKm = Math.max(800, ...near.map(c => c.epi + 150));
  const tsuMax = simTsu.length ? Math.max(...simTsu.map(c => c.epi)) + 200 : 1500;
  const tsuOn = tsunamiRisk(e) && e.type === 'quake';
  const hitDone = new Set();
  const stepFn = () => {
    const real = reduce ? 1e6 : (performance.now() - start) / 1000;
    const tRaw = originTime ? (Date.now() - originTime) / 1000 : real * speed;
    const t = Math.min(tRaw, near.reduce((m, c) => Math.max(m, c.ts), 0) + 5 + maxKm / VS);
    const rP = Math.sqrt(Math.max(0, (VP * t) ** 2 - e.depth ** 2));
    const rS = Math.sqrt(Math.max(0, (VS * t) ** 2 - e.depth ** 2));
    const paths = [];
    if (rP > 0 && rP < maxKm * 1.7) paths.push({ pts: circle(e.lat, e.lng, rP), c: 'rgba(124,192,255,0.9)', w: 0.45 });
    if (rS > 0) paths.push({ pts: circle(e.lat, e.lng, Math.min(rS, maxKm)), c: 'rgba(255,90,60,0.95)', w: 0.8 });
    let tt = 0;
    if (tsuOn) {
      tt = Math.min(real * 600, tsuMax / TSU_KMH * 3600);
      const rT = TSU_KMH * tt / 3600;
      if (rT > 5) paths.push({ pts: circle(e.lat, e.lng, rT, 160), c: 'rgba(70,214,232,0.9)', w: 0.6, dash: true });
    }
    world.pathsData(paths);
    const tEl = $('simT'); if (tEl) tEl.textContent = '+' + Math.round(t) + '초';
    near.forEach((c, i) => {
      const td = $('cs' + i); if (!td) return;
      let cls, txt;
      if (t < c.tp) { cls = 'st'; txt = `P파 ${Math.ceil(c.tp - t)}초`; }
      else if (t < c.ts) { cls = 'st s'; txt = `S파 ${Math.ceil(c.ts - t)}초`; }
      else { cls = 'st hit'; txt = 'S파 도달'; if (!hitDone.has(i)) { hitDone.add(i); if (i === 0) beep('hit'); } }
      if (td.textContent !== txt) td.textContent = txt;
      if (td.className !== cls) td.className = cls;
    });
    if (e.type === 'eew') (e.areas || []).forEach((a, i) => {
      const td = $('ea' + i); if (!td || !a.arrival) return;
      const left = Math.ceil((a.arrival - Date.now()) / 1000);
      const txt = left > 0 ? `${left}초` : '도달';
      if (td.textContent !== txt) { td.textContent = txt; td.className = left > 0 ? 'st s' : 'st hit'; }
    });
    const tsEl = $('tsT'); if (tsEl) tsEl.textContent = '+' + Math.round(tt / 60) + '분';
    simTsu.forEach((c, i) => {
      const td = $('ts' + i); if (!td) return;
      const left = c.eta - tt;
      const txt = left > 0 ? `${Math.ceil(left / 60)}분 남음` : '도달 추정';
      if (td.textContent !== txt) { td.textContent = txt; td.className = left > 0 ? 'st s' : 'st hit'; }
    });
    if (reduce || (rS >= maxKm && (!tsuOn || tt * TSU_KMH / 3600 >= tsuMax) && e.type !== 'eew')) clearInterval(simTimer);
  };
  clearInterval(simTimer);
  simTimer = setInterval(stepFn, 80); stepFn();
}
function startMissile(e) {
  const start = performance.now(), FLIGHT = 720;
  const stepFn = () => {
    const t = reduce ? FLIGHT : Math.min(FLIGHT, (performance.now() - start) / 1000 * 60);
    const left = FLIGHT - t, n = $('mslT');
    if (n) n.textContent = left > 0 ? `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(Math.floor(left % 60)).padStart(2, '0')}` : '낙하 추정';
    if (left <= 0) { clearInterval(simTimer); beep('hit'); world.ringsData([{ lat: e.impact.lat, lng: e.impact.lng, max: 9, color: 'rgba(255,77,61,A)' }]); }
  };
  clearInterval(simTimer);
  simTimer = setInterval(stepFn, 100); stepFn();
}

// ================= LIVE DATA =================
function normalizeQuake(q) { return { ...q, type: 'quake', time: +q.time }; }
function addQuake(q, live) {
  const e = normalizeQuake(q);
  const i = events.findIndex(x => x.id === e.id);
  if (i >= 0) events[i] = e; else events.push(e);
  events.sort((a, b) => a.time - b.time);
  applyLayers();
  if (live) { prependFeed(e); updateStats(); }
  return e;
}
function handleNew(e) {
  if (sev(e) === 'low') { world.ringsData([{ lat: e.lat, lng: e.lng, max: 3, color: 'rgba(159,211,255,A)' }]); setTimeout(() => { if (!busy) world.ringsData([]); }, 4000); return; }
  if (paused) return;
  busy ? cinemaQueue.push(e) : focusOn(e);
}
function connectStream() {
  const es = new EventSource('api/stream');
  es.addEventListener('hello', m => setStatus(JSON.parse(m.data).status));
  es.addEventListener('status', m => setStatus(JSON.parse(m.data)));
  es.addEventListener('quake', m => handleNew(addQuake(JSON.parse(m.data), true)));
  es.addEventListener('eew', m => {
    const a = { ...JSON.parse(m.data), type: 'eew' };
    extra.push(a); prependFeed(a); updateStats();
    cinemaQueue = []; focusOn(a); // early warnings always interrupt
  });
  es.addEventListener('tsunami', m => {
    const a = { ...JSON.parse(m.data), type: 'tsunami' };
    extra.push(a); prependFeed(a); updateStats();
    busy && !paused ? cinemaQueue.push(a) : tsunamiFocus(a);
  });
  es.onerror = () => { $('liveDot').textContent = '연결 끊김 · 재시도 중'; $('liveDot').classList.add('paused'); };
  es.onopen = () => { $('liveDot').textContent = paused ? '자동 이동 꺼짐' : '실시간 피드'; $('liveDot').classList.toggle('paused', paused); };
}

async function init() {
  let st = { quakes: [], alerts: [], status: {} };
  try { st = await (await fetch('api/state')).json(); }
  catch { $('bootLog').innerHTML += '\n<em>[ !! ]</em> 서버에 연결하지 못했어요. 이 페이지는 server.js로 열어야 해요.'; }
  st.quakes.forEach(q => addQuake(q, false));
  st.alerts.slice().reverse().forEach(a => extra.push({ ...a, type: a.kind }));
  setStatus(st.status);
  renderFeed(); updateStats();
  connectStream();
  return st;
}

    id: 'eew-test-' + now, type: 'eew', kind: 'eew', demo: true, cancelled: false, time: now - 3000,
    lat: 33.2, lng: 135.9, depth: 30, mag: 7.4, place: '기이반도 남쪽 앞바다 (테스트)',
    areas: [['와카야마', 'Wakayama', '6-', 18], ['미에', 'Mie', '5+', 32], ['나라', 'Nara', '5+', 30], ['오사카', 'Osaka', '5-', 42], ['효고', 'Hyogo', '4', 55], ['아이치', 'Aichi', '4', 60], ['교토', 'Kyoto', '4', 55], ['도쿠시마', 'Tokushima', '5-', 40]]
      .map(([pref, name, sc, sec]) => ({ pref, name, from: sc, to: sc, arrival: now + sec * 1000 }))
  };
  extra.push(a); prependFeed(a); cinemaQueue = []; focusOn(a);
}
$('eewTest').addEventListener('click', testEEW);
function fireMissile() {
  const e = { id: 'm' + Date.now(), type: 'missile', mag: 9, time: Date.now(), title: '북한 탄도미사일 발사 추정 (데모)', lat: 39.66, lng: 124.70, impact: { lat: 40.9, lng: 136.2 } };
  extra.push(e); prependFeed(e);
  missileArcs = [{ type: 'missile', startLat: e.lat, startLng: e.lng, endLat: e.impact.lat, endLng: e.impact.lng }];
  applyLayers(); cinemaQueue = []; focusOn(e, true);
}
$('jalert').addEventListener('click', fireMissile);
addEventListener('keydown', k => {
  if (k.target.closest && k.target.closest('input, textarea')) return;
  if (k.key === ' ' && !(k.target.closest && k.target.closest('button, li'))) { k.preventDefault(); setPaused(!paused); }
  else if (k.key === 'n' || k.key === 'N') nextSignificant();
  else if (k.key === 'j' || k.key === 'J') fireMissile();
  else if (k.key === 'e' || k.key === 'E') $('eewTest').click();
  else if (k.key === 'Escape' && busy) { clearTimeout(resumeTimer); resume(); }
  else if (k.key >= '1' && k.key <= '6') toggleLayer(LAYER_DEFS[+k.key - 1][0]);
});

// ================= BOOT =================
let booted = false;
function endBoot(st) {
  if (booted) return; booted = true;
  $('boot').classList.add('out');
  setTimeout(() => $('boot').remove(), 700);
  const sig = recentQuakes().filter(e => sev(e) !== 'low').sort((a, b) => b.time - a.time)[0];
  if (sig && !paused) setTimeout(() => focusOn(sig), T(1200));
}
(async () => {
  const log = $('bootLog');
  const add = (l, wait = 200) => new Promise(r => { log.innerHTML += (log.innerHTML ? '\n' : '') + l; setTimeout(r, reduce ? 0 : wait); });
  $('boot').addEventListener('click', () => endBoot());
  await add('<span class="h">WATCHFLOOR</span>');
  await add('실시간 감시 콘솔 초기화 중…');
  const st = await init();
  const S = st.status || {};
  const okTag = s => s === 'ok' || s === 'ready' ? '<b>[ OK ]</b>' : s === 'snapshot' || s === 'wait' ? '<em>[ .. ]</em>' : '<em>[ -- ]</em>';
  await add(`${okTag(S.usgs)} USGS 지진 · ${events.filter(e => e.src !== 'jma').length}건${S.usgs === 'snapshot' ? ' (오프라인 스냅샷)' : ''}`);
  await add(`${okTag(S.jma)} 일본 기상청 (P2P지진정보) · ${events.filter(e => e.src === 'jma').length}건${S.jma === 'off' ? ' · 꺼짐' : ''}`);
  await add(`${okTag(S.webcams)} 웹캠 · ${S.webcams === 'off' ? 'Windy 키 없음 (cams.json / 링크 사용)' : 'Windy 연결'}`);
  await add(`${okTag(S.ai)} AI 브리핑 · ${S.ai === 'off' ? '꺼짐' : 'Claude 연결'}`);
  await add(`<b>[ OK ]</b> 원전 ${PLANTS.length}기 · 해상 요충지 ${CHOKES.length}곳 · 항로 ${ROUTE_PAIRS.length}개`);
  await add('<em>[ .. ]</em> 경보 엔진 가동 · 클릭하면 건너뛰어요', 500);
  endBoot(st);
})();
</script>
